      { id: 'the_whisperer', name: 'The Whisperer', icon: '🧠', type: 'boss', category: 'boss' },
      { id: 'theatre_of_blood', name: 'Theatre of Blood', icon: '🩸', type: 'boss', category: 'boss' },
      { id: 'theatre_of_blood_hard_mode', name: 'ToB: Hard Mode', icon: '☠️', type: 'boss', category: 'boss' },
      { id: 'thermonuclear_smoke_devil', name: 'Thermonuclear Smoke Devil', icon: '💨', type: 'boss', category: 'boss' },
      { id: 'tombs_of_amascut', name: 'Tombs of Amascut', icon: '🏛️', type: 'boss', category: 'boss' },
      { id: 'tombs_of_amascut_expert', name: 'ToA: Expert Mode', icon: '👑', type: 'boss', category: 'boss' },
      { id: 'tzkal_zuk', name: 'Inferno (TzKal-Zuk)', icon: '🌋', type: 'boss', category: 'boss' },
      { id: 'tztok_jad', name: 'Fight Caves (TzTok-Jad)', icon: '🔥', type: 'boss', category: 'boss' },
      { id: 'vardorvis', name: 'Vardorvis', icon: '🪓', type: 'boss', category: 'boss' },
      { id: 'venenatis', name: 'Venenatis', icon: '🕷️', type: 'boss', category: 'boss' },
      { id: 'vetion', name: "Vet'ion", icon: '💀', type: 'boss', category: 'boss' },
      { id: 'vorkath', name: 'Vorkath', icon: '🐲', type: 'boss', category: 'boss' },
      { id: 'wintertodt', name: 'Wintertodt', icon: '❄️', type: 'boss', category: 'boss' },
      { id: 'yama', name: 'Yama', icon: '👹', type: 'boss', category: 'boss' },
      { id: 'zalcano', name: 'Zalcano', icon: '☄️', type: 'boss', category: 'boss' },
      { id: 'zulrah', name: 'Zulrah', icon: '🐍', type: 'boss', category: 'boss' }
    ];

    async function loadData() {
      try {
        const res = await fetch('./data.json');
        if (!res.ok) throw new Error('data.json not found');
        
        const data = await res.json();
        
        if (data.updatedAt) {
          const date = new Date(data.updatedAt);
          document.getElementById('lastUpdated').innerText = `Last synced: ${date.toLocaleString()}`;
        }

        allMembers = data.members || [];
        filterData();
        renderHallOfFame();
      } catch (err) {
        console.error('Error loading data:', err);
        document.getElementById('leaderboardBody').innerHTML = `
          <tr>
            <td colspan="5" class="p-8 text-center text-red-400">
              Unable to load <code>data.json</code>. Run your GitHub Action workflow to generate it.
            </td>
          </tr>
        `;
      }
    }

    function switchView(view) {
      const leaderboardSec = document.getElementById('leaderboardView');
      const hofSec = document.getElementById('hofView');
      const btnLeaderboard = document.getElementById('tabLeaderboard');
      const btnHof = document.getElementById('tabHof');

      if (view === 'leaderboard') {
        leaderboardSec.classList.remove('hidden');
        hofSec.classList.add('hidden');
        btnLeaderboard.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-slate-950 shadow transition-all';
        btnHof.className = 'px-4 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
      } else {
        leaderboardSec.classList.add('hidden');
        hofSec.classList.remove('hidden');
        btnHof.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-slate-950 shadow transition-all';
        btnLeaderboard.className = 'px-4 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
      }
    }

    function filterData() {
      const selectedMetric = document.getElementById('metricSelect').value;
      const rankFilter = document.getElementById('rankSelect').value;
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

      let filtered = allMembers.map(m => {
        const metricData = (m.metrics && m.metrics[selectedMetric]) || { value: 0, level: null };
        return {
          username: m.username,
          role: m.role,
          metricValue: metricData.value || 0,
          metricLevel: metricData.level
        };
      }).filter(m => {
        if (searchQuery && !m.username.toLowerCase().includes(searchQuery)) return false;

        const role = (m.role || '').toLowerCase().replace(/_/g, ' ');
        if (rankFilter === 'STAFF' && !STAFF_ROLES.includes(role)) return false;

        return m.metricValue > 0;
      });

      filtered.sort((a, b) => b.metricValue - a.metricValue);

      renderTableHeader(selectedMetric);
      renderTable(filtered, selectedMetric);
    }

    function renderTableHeader(metric) {
      const headerRow = document.getElementById('tableHeader');
      const isSkill = SKILL_METRICS.includes(metric);

      let valueColTitle = 'Score';
      if (isSkill) valueColTitle = 'Experience';
      else if (metric === 'ehp' || metric === 'ehb') valueColTitle = 'Hours';
      else if (metric.startsWith('clue')) valueColTitle = 'Clues Completed';
      else if (metric === 'collections_logged') valueColTitle = 'Items Logged';
      else valueColTitle = 'Kill Count / Score';

      headerRow.innerHTML = `
        <th class="p-4 w-16 text-center">#</th>
        <th class="p-4">Player</th>
        <th class="p-4">Clan Role</th>
        ${isSkill ? '<th class="p-4 text-right">Level</th>' : ''}
        <th class="p-4 text-right">${valueColTitle}</th>
      `;
    }

    function renderTable(members, metric) {
      const tbody = document.getElementById('leaderboardBody');
      const isSkill = SKILL_METRICS.includes(metric);

      if (members.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${isSkill ? 5 : 4}" class="p-8 text-center text-slate-500">No players match the selected filters or have recorded stats for this metric.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = members.map((m, idx) => {
        const rankNumber = idx + 1;
        let rankBadgeClass = 'text-slate-500';
        if (rankNumber === 1) rankBadgeClass = 'text-amber-400 font-bold';
        else if (rankNumber === 2) rankBadgeClass = 'text-slate-300 font-bold';
        else if (rankNumber === 3) rankBadgeClass = 'text-amber-700 font-bold';

        const formattedRole = (m.role || 'Member').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        
        let displayValue = m.metricValue.toLocaleString();
        if (metric === 'ehp' || metric === 'ehb') displayValue = `${m.metricValue.toFixed(1)} hrs`;
        else if (isSkill) displayValue = `${displayValue} XP`;

        return `
          <tr class="hover:bg-slate-800/40 transition-colors">
            <td class="p-4 text-center ${rankBadgeClass}">${rankNumber}</td>
            <td class="p-4 font-semibold text-slate-100">
              <a href="https://wiseoldman.net/players/${encodeURIComponent(m.username)}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 hover:underline">
                ${m.username}
              </a>
            </td>
            <td class="p-4">
              <span class="px-2.5 py-1 text-xs rounded-md bg-slate-800 text-slate-300 border border-slate-700 font-mono">
                ${formattedRole}
              </span>
            </td>
            ${isSkill ? `<td class="p-4 text-right font-mono text-slate-300">${m.metricLevel || '-'}</td>` : ''}
            <td class="p-4 text-right font-mono text-amber-400 font-medium">${displayValue}</td>
          </tr>
        `;
      }).join('');
    }

    function renderHallOfFame() {
      const hofContainer = document.getElementById('hofContainer');
      const categoryFilter = document.getElementById('hofCategoryFilter').value;
      const searchQuery = (document.getElementById('hofSearchInput').value || '').toLowerCase().trim();

      const filteredMetrics = HOF_METRICS.filter(m => {
        if (categoryFilter !== 'ALL' && m.category !== categoryFilter) return false;
        if (searchQuery && !m.name.toLowerCase().includes(searchQuery) && !m.id.toLowerCase().includes(searchQuery)) return false;
        return true;
      });

      if (filteredMetrics.length === 0) {
        hofContainer.innerHTML = `
          <div class="col-span-full p-8 text-center text-slate-500 bg-slate-900 rounded-xl border border-slate-800">
            No Hall of Fame metrics match your filter criteria.
          </div>
        `;
        return;
      }

      const cardsHtml = filteredMetrics.map(m => {
        const staffCandidates = allMembers.map(mem => {
          const metricData = (mem.metrics && mem.metrics[m.id]) || { value: 0, level: null };
          return {
            username: mem.username,
            role: mem.role,
            value: metricData.value || 0
          };
        }).filter(mem => {
          const role = (mem.role || '').toLowerCase().replace(/_/g, ' ');
          return STAFF_ROLES.includes(role) && mem.value > 0;
        });

        staffCandidates.sort((a, b) => b.value - a.value);
        const leader = staffCandidates[0];

        if (!leader) {
          return `
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl opacity-50 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start mb-2">
                  <span class="text-xl">${m.icon}</span>
                  <span class="text-[10px] font-mono bg-slate-800 text-slate-500 px-2 py-0.5 rounded border border-slate-700">Unclaimed</span>
                </div>
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold">${m.name}</div>
              </div>
              <div class="mt-3">
                <div class="text-sm font-bold text-slate-600">No Record</div>
                <div class="text-xs text-slate-600 font-mono">-</div>
              </div>
            </div>
          `;
        }

        const formattedRole = (leader.role || 'Staff').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        
        let valDisplay = leader.value.toLocaleString();
        if (m.type === 'hours') valDisplay = `${leader.value.toFixed(1)} hrs`;
        else if (m.type === 'skill') valDisplay = `${valDisplay} XP`;
        else if (m.type === 'clue') valDisplay = `${valDisplay} completed`;
        else if (m.type === 'activity') valDisplay = `${valDisplay} score`;
        else if (m.type === 'boss') valDisplay = `${valDisplay} KC`;

        return `
          <div class="bg-slate-900 border border-amber-500/30 p-4 rounded-xl relative overflow-hidden shadow-lg hover:border-amber-500/60 transition-all flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xl">${m.icon}</span>
                <span class="text-[10px] font-mono bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30 font-semibold">${formattedRole}</span>
              </div>
              <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold truncate" title="${m.name}">${m.name}</div>
            </div>
            <div class="mt-3">
              <div class="text-lg font-bold text-slate-100 truncate">
                <a href="https://wiseoldman.net/players/${encodeURIComponent(leader.username)}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 hover:underline">
                  ${leader.username}
                </a>
              </div>
              <div class="text-amber-400 font-mono text-xs font-semibold mt-0.5">${valDisplay}</div>
            </div>
          </div>
        `;
      }).join('');

      hofContainer.innerHTML = cardsHtml;
    }

    loadData();
  </script>
</body>
</html>
